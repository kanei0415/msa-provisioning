---
# IRSA セットアップ playbook（自己管理 kubeadm クラスタを OIDC issuer 化）
# 前提: terraform/irsa.tf が apply されており、ansible/group_vars/irsa.yaml が
# 自動生成されていること。
- name: IRSA OIDC セットアップ
  hosts: master
  become: true
  vars_files:
    - "{{ playbook_dir }}/../group_vars/irsa.yaml"
  roles:
    - role: irsa_oidc
      tags: [irsa, oidc]
