---
# ============================================================
# クラスタ アドオン
# ============================================================
# kubelet が --cloud-provider=external で動くため、全 node が join 直後は
# `node.cloudprovider.kubernetes.io/uninitialized:NoSchedule` taint を持つ。
# CoreDNS Deployment はこの taint を tolerate しないので、CCM が taint を
# 除去するまで Pending のまま。
#
# よって順序は厳密に:
#   1) helm binary 導入
#   2) AWS CCM 投入 → uninitialized taint 除去（このタイミングで coredns が Running になる）
#   3) kube-system 全 pod が Ready になるのを確認してから残りの addon を入れる

- name: 事前段 — Helm と AWS CCM
  hosts: master
  become: true
  roles:
    - role: helm
      tags: [helm]
    - role: aws_ccm
      tags: [ccm, aws_ccm]

- name: 本段 — AWS LBC / ArgoCD / Traefik
  hosts: master
  become: true
  pre_tasks:
    - name: kube-system の全 pod が Running/Succeeded になるまで待つ
      ansible.builtin.shell: |
        set -o pipefail
        kubectl --kubeconfig={{ admin_conf_path }} get pods -n kube-system \
          --no-headers \
          -o custom-columns='NAME:.metadata.name,PHASE:.status.phase,READY:.status.containerStatuses[*].ready' \
          | awk '{
              if ($2 != "Running" && $2 != "Succeeded") { print "NOT_READY:"$0; bad=1 }
              else if ($2 == "Running" && index($3, "false") > 0) { print "NOT_READY:"$0; bad=1 }
            } END { exit bad ? 1 : 0 }'
      args:
        executable: /bin/bash
      register: kube_system_ready
      changed_when: false
      retries: 60
      delay: 10
      until: kube_system_ready.rc == 0
  roles:
    - role: aws_lbc
      tags: [lbc, aws_lbc]
    - role: argocd
      tags: [argocd]
    - role: traefik
      tags: [traefik]
      when: deploy_traefik | bool
