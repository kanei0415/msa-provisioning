---
- name: /etc/hosts に master_private_ip を追加（自分自身を local 解決）
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 {{ master_private_ip }}"

- name: kubeadm / kubectl のインストール (AMI に入っている前提だが冪等で確認)
  ansible.builtin.dnf:
    name:
      - kubeadm
      - kubectl
    state: present
    disable_excludes: kubernetes

- name: containerd の起動と有効化（init 前の保証）
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

- name: /etc/kubernetes ディレクトリ
  ansible.builtin.file:
    path: /etc/kubernetes
    state: directory
    mode: "0755"

# ------------------------------------------------------------
# IMDSv2 から自インスタンスの instance-id / AZ を取得
# ------------------------------------------------------------
- name: IMDSv2 token を取得
  ansible.builtin.uri:
    url: http://169.254.169.254/latest/api/token
    method: PUT
    headers:
      X-aws-ec2-metadata-token-ttl-seconds: "60"
    return_content: true
  register: imds_token

- name: 自インスタンスの instance-id を取得
  ansible.builtin.uri:
    url: http://169.254.169.254/latest/meta-data/instance-id
    headers:
      X-aws-ec2-metadata-token: "{{ imds_token.content }}"
    return_content: true
  register: imds_instance_id

- name: 自インスタンスの AZ を取得
  ansible.builtin.uri:
    url: http://169.254.169.254/latest/meta-data/placement/availability-zone
    headers:
      X-aws-ec2-metadata-token: "{{ imds_token.content }}"
    return_content: true
  register: imds_az

- name: IMDS から取得した値を fact 化
  ansible.builtin.set_fact:
    aws_instance_id: "{{ imds_instance_id.content }}"
    aws_instance_az: "{{ imds_az.content }}"

- name: kubeadm-config.yaml の生成
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    mode: "0644"

- name: kubeadm init の実行（admin.conf が無い場合のみ）
  ansible.builtin.command: >
    kubeadm init
    --config /etc/kubernetes/kubeadm-config.yaml
  args:
    creates: "{{ admin_conf_path }}"
  register: kubeadm_init_result

- name: kubectl 用の .kube ディレクトリ
  ansible.builtin.file:
    path: "/home/{{ ec2_user }}/.kube"
    state: directory
    mode: "0755"
    owner: "{{ ec2_user }}"
    group: "{{ ec2_user }}"

- name: admin.conf を ec2-user の kubeconfig としてコピー
  ansible.builtin.copy:
    src: "{{ admin_conf_path }}"
    dest: "{{ kubeconfig_path }}"
    remote_src: true
    owner: "{{ ec2_user }}"
    group: "{{ ec2_user }}"
    mode: "0600"

# ------------------------------------------------------------
# join command を SSM Parameter Store に書き出す
# ------------------------------------------------------------
# ASG worker の UserData が `aws ssm get-parameter` でこれを読み、kubeadm join する。
# kubeadm token は default 24h で切れるので、本タスクは cluster-up のたびに refresh される。

- name: 新しい join token + cert hash を含む join command を生成
  ansible.builtin.command: kubeadm token create --print-join-command --ttl 24h
  environment:
    KUBECONFIG: "{{ admin_conf_path }}"
  register: kubeadm_join_cmd
  changed_when: true

- name: 生成した join command を SSM SecureString に書き込む
  ansible.builtin.command: >
    aws ssm put-parameter
    --name "{{ kubeadm_join_command_ssm_name }}"
    --type SecureString
    --overwrite
    --value "{{ kubeadm_join_cmd.stdout }}"
    --region {{ aws_region }}
  changed_when: true
  no_log: true   # token を log に出さない
