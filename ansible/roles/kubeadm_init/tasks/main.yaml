---
- name: /etc/hosts に master_private_ip を追加
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 {{ master_private_ip }}"

- name: kubeadm / kubectl のインストール
  ansible.builtin.dnf:
    name:
      - kubeadm
      - kubectl
    state: present
    disable_excludes: kubernetes

- name: containerd の起動と有効化（init 前の保証）
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

- name: /etc/kubernetes ディレクトリ
  ansible.builtin.file:
    path: /etc/kubernetes
    state: directory
    mode: "0755"

- name: kubeadm-config.yaml の生成
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    mode: "0644"

- name: kubeadm init の実行（admin.conf が無い場合のみ）
  ansible.builtin.command: >
    kubeadm init
    --config /etc/kubernetes/kubeadm-config.yaml
  args:
    creates: "{{ admin_conf_path }}"
  register: kubeadm_init_result

- name: kubectl 用の .kube ディレクトリ
  ansible.builtin.file:
    path: "/home/{{ ec2_user }}/.kube"
    state: directory
    mode: "0755"
    owner: "{{ ec2_user }}"
    group: "{{ ec2_user }}"

- name: admin.conf を ec2-user の kubeconfig としてコピー
  ansible.builtin.copy:
    src: "{{ admin_conf_path }}"
    dest: "{{ kubeconfig_path }}"
    remote_src: true
    owner: "{{ ec2_user }}"
    group: "{{ ec2_user }}"
    mode: "0600"
