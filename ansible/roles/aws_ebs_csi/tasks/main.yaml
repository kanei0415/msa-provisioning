---
# ============================================================
# AWS EBS CSI Driver (Helm)
# ============================================================
# - controller は IRSA で AWS API を叩く（kube-system:ebs-csi-controller-sa）
# - node は DaemonSet (host network, host-mount /dev) で attach/detach 補佐
# - 既定の gp3 StorageClass を作って default に指定する
# - Terraform 側 IRSA Role: aws_iam_role.ebs_csi (terraform/irsa.tf)

- name: aws-ebs-csi-driver Helm リポジトリの登録
  kubernetes.core.helm_repository:
    name: aws-ebs-csi-driver
    repo_url: "https://kubernetes-sigs.github.io/aws-ebs-csi-driver"
    state: present

- name: AWS EBS CSI Driver の Helm インストール
  kubernetes.core.helm:
    name: aws-ebs-csi-driver
    chart_ref: aws-ebs-csi-driver/aws-ebs-csi-driver
    release_namespace: kube-system
    kubeconfig: "{{ kubeconfig_path }}"
    create_namespace: false
    update_repo_cache: true
    wait: true
    values:
      controller:
        serviceAccount:
          create: true
          name: ebs-csi-controller-sa
          annotations:
            eks.amazonaws.com/role-arn: "{{ irsa_ebs_csi_role_arn }}"
        # master に寄せる（cluster-autoscaler の評価対象から除外）
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            effect: NoSchedule
        # CCM が node に provider-id を入れるまで待つため retry を入れておく
        extraVolumeTags:
          ClusterName: "{{ cluster_name }}"
          ManagedBy: "ebs-csi-driver"
      node:
        # ASG の worker は taint なし、master は control-plane taint。
        # node ds は worker に置ければ十分。tolerations は default のまま。
        tolerateAllTaints: false
      storageClasses: []  # 自前で作る
  register: ebs_csi_install
  retries: 5
  delay: 20
  until: ebs_csi_install is success

# ------------------------------------------------------------
# 既定の gp3 StorageClass（PVC が storageClassName 未指定でも動くように default 指定）
# ------------------------------------------------------------
- name: ebs-sc (gp3, default) StorageClass を作成
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: ebs-sc
        annotations:
          storageclass.kubernetes.io/is-default-class: "true"
      provisioner: ebs.csi.aws.com
      parameters:
        type: gp3
        encrypted: "true"
        # KMS key 未指定 → AWS managed key
      reclaimPolicy: Delete
      volumeBindingMode: WaitForFirstConsumer
      allowVolumeExpansion: true

# 旧来 in-tree provisioner の "gp2" SC が default に居ると drift するので default 解除
- name: 既存 default StorageClass が ebs-sc 以外なら default 解除
  ansible.builtin.shell: |
    # set -o pipefail を使わない: grep -v が空マッチで rc=1 を返すパターン
    set -eu
    OTHERS=$(kubectl --kubeconfig={{ admin_conf_path }} get sc -o json \
      | jq -r '.items[]
          | select(.metadata.annotations["storageclass.kubernetes.io/is-default-class"]=="true")
          | .metadata.name' \
      | { grep -v '^ebs-sc$' || true; })
    for sc in $OTHERS; do
      kubectl --kubeconfig={{ admin_conf_path }} annotate sc "$sc" \
        storageclass.kubernetes.io/is-default-class=false --overwrite
    done
  args:
    executable: /bin/bash
  changed_when: false
