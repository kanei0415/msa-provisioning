---
- name: スワップの無効化（即時）
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | int > 0
  changed_when: ansible_swaptotal_mb | int > 0

- name: "スワップの無効化（永続: /etc/fstab）"
  ansible.posix.mount:
    name: "{{ item.mount }}"
    fstype: "{{ item.fstype }}"
    src: "{{ item.device }}"
    state: absent
  loop: "{{ ansible_mounts | selectattr('fstype', 'equalto', 'swap') | list }}"
  loop_control:
    label: "{{ item.mount }}"

- name: カーネルモジュールの恒久ロード設定
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter
  notify: reload kernel modules

- name: カーネルモジュールの即時ロード
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: sysctl パラメータの設定
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/k8s.conf
    state: present
    sysctl_set: true
    reload: true
  loop:
    - { name: "net.bridge.bridge-nf-call-iptables", value: "1" }
    - { name: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
    - { name: "net.ipv4.ip_forward", value: "1" }
    # Elasticsearch (platform logging stack + SonarQube の embedded ES) は
    # 起動時に大量の memory-map 領域を要求するため vm.max_map_count を引き上げる。
    # 未設定だと ES が bootstrap check で起動失敗する。AMI に焼き込むことで
    # master と ASG worker の全ノードへ適用される。
    - { name: "vm.max_map_count", value: "262144" }
    # 多数の Pod / コンテナ (Prometheus, Kafka, Istio sidecar 等) が大量の
    # inotify watch を張るため上限を引き上げる。
    - { name: "fs.inotify.max_user_instances", value: "8192" }
    - { name: "fs.inotify.max_user_watches", value: "524288" }

- name: /etc/hosts に master のエントリを追加
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ master_private_ip }} master"
    regexp: '\smaster$'
    state: present

- name: /etc/hosts に自分自身のホスト名エントリを追加
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ ansible_default_ipv4.address }} {{ ansible_hostname }}"
    regexp: "\\s{{ ansible_hostname }}$"
    state: present
