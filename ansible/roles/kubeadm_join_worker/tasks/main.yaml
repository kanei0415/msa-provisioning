---
# ------------------------------------------------------------
# master 側で join に必要な情報を 1 度だけ生成
# ------------------------------------------------------------
- name: Join 用 token / hash を master で生成
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  become: true
  block:
    - name: kubeadm token create で join コマンド生成
      ansible.builtin.command: kubeadm token create --print-join-command
      environment:
        KUBECONFIG: "{{ admin_conf_path }}"
      register: worker_join_cmd_raw
      changed_when: false

    - name: join コマンドから endpoint / token / hash を抽出
      ansible.builtin.set_fact:
        kubeadm_apiserver_endpoint: "{{ worker_join_cmd_raw.stdout
            | regex_search('kubeadm join (\\S+)', '\\1') | first }}"
        kubeadm_token: "{{ worker_join_cmd_raw.stdout
            | regex_search('--token (\\S+)', '\\1') | first }}"
        kubeadm_ca_cert_hash: "{{ worker_join_cmd_raw.stdout
            | regex_search('--discovery-token-ca-cert-hash (\\S+)', '\\1') | first }}"

    - name: 抽出した値を worker 全台に fact として配布
      ansible.builtin.set_fact:
        kubeadm_apiserver_endpoint: "{{ kubeadm_apiserver_endpoint }}"
        kubeadm_token: "{{ kubeadm_token }}"
        kubeadm_ca_cert_hash: "{{ kubeadm_ca_cert_hash }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['workers'] }}"

# ------------------------------------------------------------
# worker 各台で自分の IMDS データを取得
# ------------------------------------------------------------
# kubelet --provider-id に埋め込む aws:///<az>/<instance-id> を組み立てる。

- name: IMDSv2 token を取得（worker）
  ansible.builtin.uri:
    url: http://169.254.169.254/latest/api/token
    method: PUT
    headers:
      X-aws-ec2-metadata-token-ttl-seconds: "60"
    return_content: true
  register: imds_token

- name: 自インスタンスの instance-id を取得（worker）
  ansible.builtin.uri:
    url: http://169.254.169.254/latest/meta-data/instance-id
    headers:
      X-aws-ec2-metadata-token: "{{ imds_token.content }}"
    return_content: true
  register: imds_instance_id

- name: 自インスタンスの AZ を取得（worker）
  ansible.builtin.uri:
    url: http://169.254.169.254/latest/meta-data/placement/availability-zone
    headers:
      X-aws-ec2-metadata-token: "{{ imds_token.content }}"
    return_content: true
  register: imds_az

- name: IMDS から取得した値を fact 化
  ansible.builtin.set_fact:
    aws_instance_id: "{{ imds_instance_id.content }}"
    aws_instance_az: "{{ imds_az.content }}"

# ------------------------------------------------------------
# JoinConfiguration を render して kubeadm join を実行
# ------------------------------------------------------------

- name: /etc/kubernetes ディレクトリ（worker）
  ansible.builtin.file:
    path: /etc/kubernetes
    state: directory
    mode: "0755"

- name: kubeadm-join-config.yaml の生成
  ansible.builtin.template:
    src: kubeadm-join-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-join-config.yaml
    mode: "0600"

- name: kubeadm join の実行（--config 使用）
  ansible.builtin.command: kubeadm join --config /etc/kubernetes/kubeadm-join-config.yaml
  args:
    creates: /etc/kubernetes/kubelet.conf
  register: worker_join_result
  failed_when:
    - worker_join_result.rc is defined
    - worker_join_result.rc != 0
    - "'already exists' not in (worker_join_result.stderr | default(''))"
