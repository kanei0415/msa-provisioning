---
kubernetes_version: "1.30"
pod_subnet: "192.168.0.0/16"

containerd_cri_socket: "unix:///var/run/containerd/containerd.sock"

ec2_user: "ec2-user"
kubeconfig_path: "/home/ec2-user/.kube/config"
admin_conf_path: "/etc/kubernetes/admin.conf"

calico_version: "v3.27.0"

helm_version: "v3.14.0"

argocd_namespace: "argocd"
argocd_root_app_repo: "https://github.com/kanei0415/ktcloud-k8s-argocd-manifest.git"
argocd_root_app_path: "Setup"
argocd_root_path: "/argocd"

# aws_region は terraform inventory が all:vars に流すのでこちらは override 用 fallback
aws_lbc_namespace: "kube-system"
aws_ccm_namespace: "kube-system"

# ASG 化により Traefik は本構成で常時 NLB を立てる前提（destroy-all の cleanup 対象でもある）
deploy_traefik: true
traefik_namespace: "traefik"

# Terraform 側 var.worker_asg_desired_per_az と揃える（wait_workers の見積もりに使う）
worker_asg_desired_per_az: 2
